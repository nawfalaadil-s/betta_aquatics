<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071326" />
      <stop offset="100%" stop-color="#0f294d" />
    </linearGradient>
    <linearGradient id="finGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="45%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="60%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="2.5" />
  
  <!-- Flowing Betta Caudal / Tail Fins -->
  <path d="M50 50 C58 36, 76 28, 88 38 C94 44, 95 62, 86 74 C74 88, 58 76, 50 50 Z" fill="url(#coralGrad)" opacity="0.95" filter="url(#glow)" />
  <path d="M54 50 C62 38, 74 34, 82 42 C87 47, 88 60, 80 68 C70 78, 58 70, 54 50 Z" fill="url(#finGrad)" opacity="0.75" />

  <!-- Flowing Dorsal Fin -->
  <path d="M38 32 C34 16, 50 12, 64 16 C74 20, 80 30, 76 38 C68 34, 52 28, 38 32 Z" fill="url(#finGrad)" opacity="0.95" />

  <!-- Flowing Ventral / Anal Fin -->
  <path d="M32 68 C22 80, 36 90, 48 86 C58 82, 64 74, 60 68 C50 72, 38 72, 32 68 Z" fill="url(#coralGrad)" opacity="0.85" />

  <!-- Muscular Betta Body -->
  <path d="M68 50 C68 34, 52 24, 36 28 C24 31, 16 42, 14 52 C12 62, 20 72, 32 74 C48 78, 66 68, 68 50 Z" fill="url(#finGrad)" />

  <!-- Betta Head & Eye -->
  <circle cx="24" cy="48" r="4" fill="#ffffff" />
  <circle cx="23" cy="47.5" r="2.2" fill="#071326" />
  <circle cx="22.2" cy="46.8" r="0.8" fill="#00F2FE" />
</svg>